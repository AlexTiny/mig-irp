script>
const data={ssm:[['Identificarea pericolelor și evaluarea riscurilor','Analiza pericolelor și evaluarea riscurilor pentru activități, posturi și echipamente.','Depozit: circulația stivuitoarelor și manipularea coletelor.'],['Plan de prevenire și protecție','Elaborarea și actualizarea măsurilor de prevenire și protecție.','Atelier: măsuri pentru utilaje și zone de lucru.'],['Instrucțiuni proprii SSM','Instrucțiuni adaptate fiecărui tip de activitate.','Instrucțiuni pentru manipularea mărfurilor.'],['Tematici de instruire SSM','Structurarea temelor de instruire a lucrătorilor.','Tematică distinctă pentru birou și depozit.'],['Decizii SSM','Documente interne de organizare a responsabilităților.','Decizie privind atribuțiile în domeniul SSM.'],['Cercetarea evenimentelor','Participare la analiza evenimentelor în limitele competențelor legale.','Documentarea circumstanțelor unui incident.'],['Semnalizare de securitate','Identificarea zonelor care necesită semnalizare.','Marcarea căilor pietonale și a zonelor de risc.']],su:[['Instrucțiuni proprii SU','Documente interne pentru prevenirea situațiilor de urgență.','Instrucțiuni pentru spații de depozitare.'],['Tematici de instruire SU','Teme de instruire adaptate activităților.','Instruire privind alarmarea și evacuarea.'],['Dispoziții și organizare','Documente organizatorice SU; formularea exactă se confirmă din documentele firmei.','Stabilirea responsabilităților interne.'],['Exerciții de alarmare și evacuare','Asistență la exerciții și note de control intern.','Simulare de evacuare dintr-un sediu.']],rsvti:[['Instalații de ridicat','Supravegherea tehnică a instalațiilor reglementate, în limitele autorizărilor.','Stivuitoare, elevatoare și platforme cu nacelă.'],['Instalații sub presiune','Supravegherea instalațiilor sub presiune conform reglementărilor aplicabile.','Recipiente de aer comprimat și centrale termice.'],['Personal deservent','Sprijin pentru instruire și autorizare în limitele competențelor aplicabile.','Personal care deservește instalații de ridicat.']]};const content=document.getElementById('content');function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt)n.textContent=txt;return n}function title(k,t){content.append(el('div','eyebrow',k),el('h1','heading',t))}function para(s){content.append(el('p','muted',s))}function go(p){content.replaceChildren();if(p==='home'){title('MIG IRP · Călărași','Siguranța începe cu oamenii.');para('Prevenim riscuri. Protejăm oameni. Susținem afaceri.');const grid=el('div','grid');[['ssm','Securitate și Sănătate în Muncă'],['su','Situații de Urgență'],['rsvti','Operator RSVTI – ISCIR']].forEach(([key,name])=>{const tile=el('div','tile reveal');tile.append(el('h3','',name),el('p','muted',data[key].length+' subcategorii'));const b=el('button','','Explorează →');b.onclick=()=>go(key);tile.append(b);grid.append(tile)});content.append(grid)}else if(data[p]){title('SERVICII · '+p.toUpperCase(),{ssm:'Securitate și Sănătate în Muncă',su:'Situații de Urgență',rsvti:'Operator RSVTI – ISCIR'}[p]);para('Selectează fiecare subcategorie pentru descriere și exemplu practic.');data[p].forEach((x,i)=>{const box=el('div','accordion reveal'),b=el('button','',String(i+1).padStart(2,'0')+' · '+x[0]+'   +'),detail=el('div','detail hidden');detail.append(el('p','',x[1]),el('div','example','Exemplu: '+x[2]));b.setAttribute('aria-expanded','false');b.onclick=()=>{const show=detail.classList.contains('hidden');detail.classList.toggle('hidden',!show);b.setAttribute('aria-expanded',String(show))};box.append(b,detail);content.append(box)});const btn=el('button','primary','Solicită ofertă pentru acest serviciu');btn.onclick=()=>go('contact');content.append(btn)}else if(p==='services'){title('PORTOFOLIU','Trei domenii, 14 subcategorii.');['ssm','su','rsvti'].forEach(k=>{const b=el('button','primary',k.toUpperCase()+' →');b.style.margin='7px';b.onclick=()=>go(k);content.append(b)})}else if(p==='about'){title('DESPRE NOI','Responsabilitate și prevenție.');para('MIG IRP SRL · J51/494/2007 · RO22208453. Activitate în județul Călărași. Abordarea propusă pune accent pe oameni, responsabilitate și riscurile reale ale organizației.')}else if(p==='resources'){title('RESURSE','Ghiduri și întrebări frecvente');[['SSM','Ce presupune evaluarea riscurilor?','Identificarea pericolelor, evaluarea riscurilor și stabilirea măsurilor de prevenire.'],['SU','De ce se fac exerciții de evacuare?','Pentru a exersa procedurile și a identifica aspectele care necesită îmbunătățire.'],['RSVTI','Toate echipamentele necesită RSVTI?','Nu. Cerințele depind de tipul instalației și de reglementările aplicabile.']].forEach(([tag,q,a])=>{const box=el('div','tile reveal');box.append(el('div','eyebrow',tag),el('h3','',q),el('p','muted',a));box.style.marginBottom='12px';content.append(box)});para('Biblioteca completă și documentele de autorizare se vor publica după verificare.')}else if(p==='contact'){title('CERERE DE OFERTĂ','Hai să discutăm.');para('Formular demonstrativ: deschide aplicația de e-mail, fără a stoca datele pe server.');const f=el('form','form');f.innerHTML='<div class="field"><label for="n">Companie / Nume</label><input id="n" required></div><div class="field"><label for="e">E-mail</label><input id="e" type="email" required></div><div class="field"><label for="s">Serviciu</label><select id="s"><option>SSM</option><option>SU / PSI</option><option>RSVTI</option><option>Toate cele trei</option></select></div><div class="field"><label for="m">Detalii</label><textarea id="m" rows="4"></textarea></div><button class="primary" type="submit">Pregătește e-mailul →</button>';f.onsubmit=e=>{e.preventDefault();const val=id=>f.querySelector('#'+id).value;location.href='mailto:migirp_mg2007@yahoo.com?subject='+encodeURIComponent('Cerere ofertă MIG IRP - '+val('s'))+'&body='+encodeURIComponent('Nume: '+val('n')+'\nE-mail: '+val('e')+'\nDetalii: '+val('m'))};content.append(f)}document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));requestAnimationFrame(()=>{content.querySelectorAll('.reveal').forEach((x,i)=>setTimeout(()=>x.classList.add('visible'),Math.min(i*55,350)))});content.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'})}document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));go('home');
